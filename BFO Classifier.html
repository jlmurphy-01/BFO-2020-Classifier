const NOTE={object:'The entity is a maximal instance of a causal unity which it necessarily manifests.'};
const R={};for(const[k,v]of Object.entries(M))R[v]=k;

const LAT=[["fiat object part", "object", "The left half of an uncut loaf of bread vs the whole loaf"], ["site", "material entity", "A hole in swiss cheese"], ["object", "object aggregate", "A single lion vs a pack of lions"], ["process boundary", "process", "The instant a walker's foot first leaves the ground vs the walk"], ["material entity", "site", "A car vs the garage interior it's parked in"], ["material entity", "process", "The surgeon participates in the surgery"], ["material entity", "history", "A bridge vs everything that has ever happened in and to the bridge"], ["material entity", "spatial region", "The tennis ball vs the space the ball occupies"], ["site", "three-dimensional spatial region", "The interior of a car (site) vs the region the interior occupies at a particular time (spatial region)"], ["fiat line", "one-dimensional spatial region", "The edge of the table vs where that edge lies based on the table's position in different parts of the room"], ["fiat point", "zero-dimensional spatial region", "The center point of the table vs where that center point sits as the table moves around the room"], ["fiat surface", "two-dimensional spatial region", "The surface of planet Earth vs the two-dimensional region in space that the Earth's surface occupies"], ["process", "temporal region", "The act of performing a kick vs the time it takes to perform that kick"], ["process boundary", "temporal instant", "The start of a kick vs the instant in time when the kick is initiated"], ["process", "spatiotemporal region", "The flight of a jet vs the full spacetime the flight occupies"], ["process boundary", "spatiotemporal region", "The finish of a race vs the region of spacetime when the finish takes place"], ["process", "site", "The process of erosion in the Grand Canyon"], ["process", "material entity", "The process of decay in an apple"], ["process boundary", "site", "The start of a kick (process boundary) in the soccer stadium (site)"], ["process boundary", "material entity", "The moment ice starts melting in a glass of water"], ["spatiotemporal region", "spatial region", "The spacetime of a jet's flight vs the 3D region the jet fills at any given moment of the flight"], ["spatiotemporal region", "temporal region", "The spacetime of a jet's flight vs the time interval the flight takes"], ["specifically dependent continuant", "independent continuant", "The red color of the berry vs the berry itself\n\nThe role of being a student inheres in Jane Smith, who in turn is the student bearing the role"], ["relational quality", "independent continuant", "A mother's love for her son specifically depends on both the mother and the son"], ["generically dependent continuant", "independent continuant", "An mp4 file vs the computer it sits on"], ["process", "generically dependent continuant", "The surgery (process) concretizes the surgical protocol (generically dependent continuant)\n\nA movie (GDC) is concretized by screening it on a laptop (process)"], ["specifically dependent continuant", "generically dependent continuant", "The surgeon's plan for the surgery (specifically dependent continuant) concretizes the surgical protocol (generically dependent continuant)\n\nA pattern of ink dots on p. 112 of the cookbook (SDC) concretizes the recipe (GDC)"], ["process", "realizable entity", "The surgery (process) realizes the surgeon's plan for the surgery (specifically dependent continuant)\n\nThe act of writing vs the pen's function to write"], ["material entity", "disposition", "The disposition of the wine glass to break is based on the glass' molecular structure"]];
const byL={};for(const k in T)byL[T[k].l]=k;
const LATM={};for(const[d,r,t]of LAT){const rid=R[byL[r]],did=R[byL[d]];(LATM[rid]=LATM[rid]||[]).push({id:did,t})}
const NEXT={};for(const v of Object.values(Q))for(const o of v[1]){const p=o[2].split('\u2192');if(p[1]&&!NEXT[p[0]])NEXT[p[0]]=p[1].slice(1)}
let sw=[],userDef='';
const $=id=>document.getElementById(id),out=$('out'),inp=$('term'),msg=$('msg'),aiBtn=$('ai');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=t=>{msg.textContent=t||'';msg.hidden=!t};
let term='',path=[],seq=[],hist=[],cur='q0',done=false,aiAlt=null,sampleFn=null;
const fill=s=>s.replace(/“T”/g,()=>'“'+term+'”');
const snap=()=>({cur,path:path.slice(),seq:seq.slice(),done});
const restore=s=>{cur=s.cur;path=s.path;seq=s.seq;done=s.done};
const curId=()=>seq.length?seq[seq.length-1].id:'entity';
const first=d=>{const m=d.match(/^.{20,170}?[.;](\s|$)/);return m?m[0].trim():d.slice(0,170)+'\u2026'};
function step(i,why){
  const o=Q[cur][1][i],parts=o[2].split('\u2192');
  hist.push(snap());
  path.push({q:fill(Q[cur][0]),a:o[0],why});
  const f=parts[0];
  if(f==='!')cur='!';
  else if(f[0]==='?')cur=f.slice(1);
  else{seq.push({id:f,n:hist.length});cur=parts[1]?parts[1].slice(1):'DONE:'+f}
}
function start(){term=inp.value.trim();userDef='';$('defpanel').hidden=true;say('');if(!term){inp.focus();return}path=[];seq=[];hist=[];sw=[];cur='q0';done=false;aiAlt=null;render()}
const go=t=>{inp.value=t;start()};
const pick=i=>{aiAlt=null;step(i);render()};
function back(){aiAlt=null;if(done){done=false;return render()}const h=hist.pop();if(h)restore(h);sw=sw.filter(x=>x.idx<hist.length);render()}
function jump(n){const t=hist[n];if(!t)return;hist.length=n;restore(t);aiAlt=null;sw=sw.filter(x=>x.idx<hist.length);render()}
function switchTo(id){sw.push({idx:hist.length,label:T[M[curId()]].l});hist.push(snap());path.push({q:'Switched to another reading',a:T[M[id]].l});seq.push({id,n:hist.length});cur=NEXT[id]||'DONE:'+id;done=false;aiAlt=null;render()}
function ret(){const x=sw.pop();if(!x)return;const t=hist[x.idx];if(!t)return;hist.length=x.idx;restore(t);aiAlt=null;sw=sw.filter(y=>y.idx<hist.length);render()}
function render(){
  if(!term){out.innerHTML=`<div class="card empty"><h2>What do you want to classify?</h2><p class="mut">Type an entity above and press Enter, then answer the questions or let Claude suggest a path. Try one of these:</p><div class="chips">${['tank','kicking','the colour of a berry','inside a car'].map(x=>`<button class="chip" data-t="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;return}
  const A=curId(),b=M[A],e=T[b],isQ=!!Q[cur],isLeaf=cur.indexOf('DONE:')===0,isStop=cur==='!';
  const ch=[];for(let x=b;x;x=T[x].p)ch.unshift(x);
  const crumbs=ch.map((x,i)=>{const l=esc(cap(T[x].l));if(i===ch.length-1)return`<span class="pill">${l}</span>`;
    const id=R[x],s=id==='entity'?{n:0}:seq.find(q=>q.id===id);
    return s&&s.n<hist.length?`<a href="#" data-n="${s.n}">${l}</a>`:`<span class="mut">${l}</span>`}).join('<i>\u203a</i>');
  const kids=Object.values(T).filter(x=>x.p===b).map(x=>x.l);
  let left;
  if(isQ&&!done){left=`<section class="card"><div class="eyebrow q">? Question</div><h2>${esc(fill(Q[cur][0]))}</h2><div class="opts">${Q[cur][1].map((o,i)=>`<button class="opt" data-i="${i}"><b>${esc(o[0])}</b>${o[1]?`<span>${esc(o[1])}</span>`:''}</button>`).join('')}</div><p class="meta" style="margin-top:20px">None of these fit? Stop at the class you have reached.</p><div class="row" style="margin-top:8px"><button class="yes" data-yes>Yes, classify as ${esc(e.l)}</button></div></section>`}
  else if(isStop){left=`<section class="card"><div class="eyebrow" style="color:var(--o)">The tree stops here</div><h2>The decision tree has no further branch for this.</h2><p class="meta">\u201c${esc(term)}\u201d is an immaterial entity that is not a spatial projection of space-time, which the decision tree doesn\u2019t classify further.</p></section>`}
  else if(done){left=`<section class="card"><div class="eyebrow">\u2713 Classified</div><h2>${esc(term)} is a ${esc(e.l)}</h2>`
    +(TL[A]?`<p class="meta">Decision-tree name: ${esc(TL[A])}</p>`:'')
    +(e.e?`<p class="meta"><b>Examples:</b> ${esc(e.e)}</p>`:'')+e.n.map(n=>`<p class="meta"><b>Note:</b> ${esc(n)}</p>`).join('')
    +(e.a.length?`<p class="meta"><b>Also called:</b> ${esc(e.a.join(', '))}</p>`:'')
    +(kids.length?`<p class="meta"><b>More specific classes in the TTL:</b> ${esc(kids.join(', '))}</p>`:'')
    +(NOTE[A]?`<p class="meta">* ${esc(NOTE[A])}</p>`:'')
    +(e.x?`<p class="meta">This class is in the decision tree but not in the uploaded TTL.</p>`:'')
    +`<div class="chain">${esc(ch.map(x=>cap(T[x].l)).join(' \u203a '))}</div><div class="row"><button class="no" data-no>Change answer</button></div></section>`}
  else{left=`<section class="card"><div class="eyebrow">\u2713 End of this branch</div><h2>${esc(cap(e.l))} ${kids.length?`has narrower types in the TTL (${esc(kids.join(', '))}), but the decision tree stops here.`:'has no narrower types.'} Does this describe your entity?</h2>${e.e?`<p class="meta">e.g., ${esc(e.e)}</p>`:''}${NOTE[A]?`<p class="meta">* ${esc(NOTE[A])}</p>`:''}<div class="row"><button class="yes" data-yes>Yes, classify as ${esc(e.l)}</button><button class="no" data-no>No, go back a step</button></div></section>`}
  sw=sw.filter(x=>x.idx<hist.length);
  const card=(id,label,text)=>{const t=T[M[id]];return`<aside class="alt"><div class="eyebrow">\u2192 Or maybe it\u2019s a\u2026</div><h3>${esc(cap(t.l))}</h3><div class="defn"><span class="lbl">BFO class definition</span>${esc(t.d)}</div>${text?`<div class="stmt"><b>${label}</b><p>${esc(text)}</p></div>`:''}<button class="sw" data-sw="${id}">Switch to ${esc(t.l)} \u2192</button></aside>`};
  const cards=[];
  if(isLeaf&&aiAlt&&aiAlt.bid!==b)cards.push(card(R[aiAlt.bid],'Claude\u2019s reading',aiAlt.sense));
  for(const x of(LATM[A]||[]))if(x.id!==A)cards.push(card(x.id,'Example',x.t));
  const right=cards.length?`<div class="rcol">${cards.join('')}</div>`:'';
  const lastSw=sw[sw.length-1];
  const ban=lastSw?`<div class="swban"><span>You switched from <b>${esc(cap(lastSw.label))}</b>.</span><button class="no" data-ret>\u2190 Back to ${esc(cap(lastSw.label))}</button></div>`:'';
  const steps=path.length?`<details class="card"${path.some(p=>p.why)?' open':''}><summary>Your answers (${path.length})</summary><ol>${path.map(p=>`<li>${esc(p.q)} <em>${esc(p.a)}</em>${p.why?`<br><i>${esc(p.why)}</i>`:''}</li>`).join('')}</ol></details>`:'';
  out.innerHTML=`<div class="top"><button class="back" data-no${hist.length||done?'':' disabled'}>\u2039 Back</button><nav class="crumbs" aria-label="Class path">${crumbs}</nav></div>${ban}<h1>${esc(term)} <span class="isa">is_a</span> <span class="cls">${esc(cap(e.l))}</span></h1>${userDef?`<p class="desc" style="margin-bottom:12px"><span class="lbl">Your definition</span>${esc(userDef)}</p>`:''}<p class="desc"><span class="lbl">BFO class definition</span>${esc(e.d)}</p><div class="grid${right?'':' one'}">${left}${right}</div>${steps}`;
}
out.addEventListener('click',ev=>{const t=ev.target.closest('[data-i],[data-n],[data-t],[data-sw],[data-yes],[data-no],[data-ret]');if(!t)return;ev.preventDefault();const d=t.dataset;
  if(d.i!==undefined)pick(+d.i);else if(d.n!==undefined)jump(+d.n);else if(d.t!==undefined)go(d.t);else if(d.sw!==undefined)switchTo(d.sw);else if('yes' in d){done=true;render()}else if('ret' in d)ret();else back()});

(async()=>{try{if(window.claude){sampleFn=await claude.use('sample');aiBtn.hidden=!sampleFn}}catch(e){}})();
async function suggest(def){
  const t=inp.value.trim();if(!t){inp.focus();return}
  term=t;userDef=def||'';$('defpanel').hidden=true;say('');
  const spec=JSON.stringify(Object.fromEntries(Object.entries(Q).map(([k,v])=>[k,{question:v[0],options:v[1].map((o,i)=>i+': '+o[0]+(o[1]?' ('+o[1]+')':'')+' -> '+o[2].replace('→',' then ').replace(/^\?/,'goto '))}])));
  const gloss=Object.values(T).filter(x=>!x.x).map(x=>`- ${x.l}: ${x.d}${x.e?' Examples: '+x.e+'.':''}${x.n.length?' Note: '+x.n.join(' '):''}`).join('\n');

${def?`The user defined the term as: "${def}". Use the sense this definition describes (state it in "sense") and classify the thing it describes.`:'No definition was provided, so use the most common sense of the term.'}
Rules:
- Classify an individual instance that the term typically denotes (e.g. "tank" means one tank). If the term can name either a thing or something it bears or does (for example the object, and the function it carries), choose the most common sense, name it in "sense", and give the other reading in "alternative" with the exact BFO class label it would get.
- In each tree question, "the entity" and "this" refer to the term.
BFO class definitions:
${gloss}
Decision tree (JSON). Start at q0. Each option shows its index, its label, and where it leads ("goto qN" means the next question; an option that names a class and ends there is the final answer):
${spec}
Walk the tree from q0, choosing one option per question until an option has no further question. In each "why", give one short sentence that cites the relevant BFO definition. Reply with JSON only: {"sense":"the reading of the term you used","steps":[{"q":"q0","i":0,"why":"..."}],"alternative":null or {"sense":"...","class":"BFO class label"}}`;
  aiBtn.disabled=true;aiBtn.textContent='Asking Claude\u2026';
  try{
    const r=await sampleFn.json(prompt,{cache:false});
    path=[];seq=[];hist=[];sw=[];cur='q0';done=false;aiAlt=null;
    for(const s of(r.steps||[])){if(s.q!==cur||!Q[cur]||!Q[cur][1][s.i])break;step(s.i,String(s.why||''));if(cur==='!'||cur.indexOf('DONE:')===0)break}
    const reached=cur==='!'||cur.indexOf('DONE:')===0;
    const a=r.alternative&&Object.entries(T).find(([k,x])=>x.l===r.alternative.class&&R[k]);
    if(a)aiAlt={bid:a[0],sense:String(r.alternative.sense||'')};
    render();
    say(reached?'Reading used: '+String(r.sense||term)+'. Use Back or the breadcrumb to change any step.':'Claude stopped before reaching a class. Answer the remaining questions yourself.')
  }catch(e){
    say(e&&e.code==='not_granted'?'Claude access was declined, so answer the questions yourself.':e&&e.code==='rate_limited'?'Too many requests. Wait a moment and try again.':'Claude couldn\u2019t suggest a classification. Answer the questions yourself.');render()
  }
  aiBtn.disabled=false;aiBtn.textContent='Suggest with Claude'
}
aiBtn.onclick=()=>{if(!inp.value.trim()){inp.focus();return}$('defpanel').hidden=false;$('defin').focus()};
